<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Blandis</title>
<meta name="description" content="Blandis — a free browser game: pick, launch, squish and merge soft numbered blobs up to 2048.">
<meta name="theme-color" content="#121010">
<meta property="og:title" content="Blandis">
<meta property="og:description" content="Pick, launch, squish and merge soft numbered blobs up to 2048.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script type="module" src="src/main.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="btns">
  <button id="bMute"></button>
  <button id="bPause"></button>
</div>
<aside id="side" class="hide" aria-label="Global leaderboard"></aside>
<div id="overlay"><div class="card" id="card"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="update" class="hide" role="status" aria-live="polite"></div>
<div id="consent" class="hide" role="region" aria-label="Cookies"></div>
<noscript>Blandis needs JavaScript to run.</noscript>
</body>
</html>
